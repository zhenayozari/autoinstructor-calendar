<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#18181b" />
    <title>Система записи переехала</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f4f5;
      }

      main {
        width: min(100%, 680px);
      }

      .notice {
        overflow: hidden;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgb(24 24 27 / 10%);
      }

      .notice__header {
        padding: 28px 30px;
        background: #18181b;
        color: #ffffff;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #facc15;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 42px);
        line-height: 1.12;
        letter-spacing: 0;
      }

      .notice__body {
        padding: 30px;
      }

      p {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
      }

      p + p {
        margin-top: 14px;
      }

      .action {
        display: flex;
        width: 100%;
        min-height: 52px;
        margin-top: 26px;
        align-items: center;
        justify-content: center;
        padding: 13px 20px;
        border: 1px solid #18181b;
        border-radius: 6px;
        background: #18181b;
        color: #ffffff;
        font-size: 17px;
        font-weight: 750;
        text-align: center;
        text-decoration: none;
      }

      .action:hover,
      .action:focus-visible {
        background: #27272a;
      }

      .action:focus-visible {
        outline: 3px solid #facc15;
        outline-offset: 3px;
      }

      .address {
        margin-top: 16px;
        color: #52525b;
        font-size: 14px;
        text-align: center;
        overflow-wrap: anywhere;
      }

      @media (max-width: 520px) {
        body {
          align-items: start;
          padding: 16px;
        }

        main {
          margin-top: 8vh;
        }

        .notice__header,
        .notice__body {
          padding: 24px 20px;
        }

        p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="notice" aria-labelledby="page-title">
        <header class="notice__header">
          <p class="eyebrow">Важная информация</p>
          <h1 id="page-title">Система записи переехала</h1>
        </header>

        <div class="notice__body">
          <p>
            Технические работы завершены. Личный кабинет и запись на занятия
            теперь работают на основном сайте.
          </p>
          <p>Этот адрес больше не используется для записи.</p>

          <a class="action" href="https://auto-legenda.ru/">
            Перейти на новый сайт
          </a>
          <p class="address">https://auto-legenda.ru/</p>
        </div>
      </section>
    </main>

    <script>
      async function clearOldApplicationData() {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations.map((registration) => registration.unregister()),
          );
        }

        if ("caches" in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }
      }

      clearOldApplicationData().catch(() => {
        // The transition page remains usable even if browser storage is unavailable.
      });
    </script>
  </body>
</html>
